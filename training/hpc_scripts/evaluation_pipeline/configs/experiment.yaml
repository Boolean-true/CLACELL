    params:
      drop_fractions: [0.0075, 0.015, 0.025]
      stacking_cv: 5
      final_estimator: logistic
      passthrough: false
      scale: true

  custom_ensemble_rf_stacking_passthrough_scaled:
    family: custom_ensemble
    base: randomforest
    combine: stacking
    feature_importance: linearsvc
    hierarchy: true
