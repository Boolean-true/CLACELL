      n_iter: 30
      cv: 5
    params:
      drop_fractions: [0.0075, 0.015, 0.025]
      scale: true

  custom_ensemble_rf_stacking:
    family: custom_ensemble
    base: randomforest
    combine: stacking
    # Per your requirement: RandomForest ensemble uses the LinearSVC ranking.
    feature_importance: linearsvc
