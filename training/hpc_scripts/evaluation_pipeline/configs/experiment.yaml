  # ---------------------------------------------------------------------------
  # Reference models (flat: coarse and fine are trained independently)
  # ---------------------------------------------------------------------------
  singler:
    family: reference
    adapter: singler
    hierarchy: false
    tune: null
    params:
      aggregate_ref: true

  celltypist:
    family: reference
    adapter: celltypist
    hierarchy: false
    tune:
      n_iter: 30
      cv: 5
    params: {}

  scgpt:
    family: reference
    adapter: scgpt_external
    hierarchy: false
    tune: null
    params:
      # scGPT is trained on the GPU cluster. Do NOT put 'scgpt' into
      # experiment.models on the CPU pipeline; use experiment.export_scgpt
      # instead. The model entry documents the external adapter.
      export_input: true
      external_script: finetune_integration_adjusted.py
